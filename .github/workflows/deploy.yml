name: Yayınla

# Three triggers, one job:
#  - push to main          → build and publish
#  - every morning (cron)  → refresh public/trending.json and catalog.json, commit what changed, publish
#  - manual run            → same as the morning run
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * *' # 07:15 Türkiye saati
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Revaçta olanları güncelle
        # A source that is down keeps yesterday's entries; the build goes on either way.
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-trending.mjs

      - name: Güncel listeyi depoya yaz
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- public/trending.json public/catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/trending.json public/catalog.json
            git commit -m "Revaçta olanlar güncellendi"
            git push
          fi

      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
